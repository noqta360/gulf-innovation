<html lang="ar" dir="rtl">
<head>

<title>نموذج محتوى البروفايل — جلف إينوفيشن | نقطة 360</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2316181B%22/%3E%3Cg%20transform%3D%22translate%2813%2013%29%20scale%280.0664%29%22%3E%3Cpath%20fill%3D%22%23C8DA2B%22%20fill-rule%3D%22evenodd%22%20d%3D%22M-0%20461.5L0%20353L142.2%20353L284.5%20353L196.2%20264.7L108%20176.5L196.5%2088L285%20-0.5L373.2%2087.8L461.5%20176L373.7%20263.8C325.5%20312%20286%20351.9%20286%20352.3C286%20352.7%20329.5%20352.9%20382.8%20352.8L479.5%20352.5L488%20350.1C533%20337.7%20563.3%20303.5%20570.5%20257C571.6%20249.5%20571.8%20257.1%20571.9%20320.6C572%20395.3%20571.4%20411.1%20567.9%20428.3C563.3%20451%20552.3%20476.5%20539.2%20495C531%20506.5%20514.3%20524.1%20503.5%20532.6C481.5%20549.7%20456.6%20561.2%20428.2%20567.2L417.5%20569.5L208.8%20569.8L-0%20570L-0%20461.5Z%22/%3E%3C/g%3E%3C/svg%3E">

<style>
/* Lenis (MIT) */
html.lenis,html.lenis body{height:auto}
.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}

:root{
  --lime:#C8DA2B; --lime-2:#B7C91F; --lime-soft:#F3F6DC; --olive:#5B6A00;
  --ink:#16181B; --ink-2:#24272B; --paper:#F4F4EF; --card:#FFFFFF; --line:#E4E4DC; --line-2:#D6D6CC;
  --muted:#6D7068; --sand:#F8F3EA; --sand-ink:#6A4A23; --warn:#B0531C; --warn-soft:#FBEEE3;
  --r:22px; --head:64px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:"IBM Plex Sans Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
  --num:"Playfair Display", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:#C9CBBF transparent;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CFD1C5;border-radius:10px;border:3px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}
html,body{margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--lime);color:var(--ink)}
a{color:var(--olive)}
.num{font-family:var(--num);font-feature-settings:"lnum"}

/* ───────── Header ───────── */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;transition:box-shadow .3s var(--ease)}
.top.scrolled{box-shadow:0 10px 30px rgba(22,24,27,.18)}
.top-in{max-width:1220px;margin:0 auto;height:var(--head);padding:0 26px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;color:var(--lime);flex:none}
.logo svg{height:32px;width:auto;display:block}
.logo img{height:34px;width:auto;display:block}
.top-title{color:#A9ACA4;font-size:13.5px;border-inline-start:1px solid #33363A;padding-inline-start:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title b{color:#fff;font-weight:600}
.save{margin-inline-start:auto;font-size:12.5px;color:#A9ACA4;display:flex;align-items:center;gap:8px;white-space:nowrap}
.save .dot{width:7px;height:7px;transform:rotate(45deg);background:#4A4D52;transition:background .4s}
.save.on .dot{background:var(--lime)}
.prog{height:3px;background:#2C2F33}
.prog i{display:block;height:100%;width:0;background:var(--lime);transition:width .7s var(--ease)}

/* ───────── Layout ───────── */
.wrap{max-width:1220px;margin:0 auto;padding:34px 26px 40px;display:grid;grid-template-columns:262px minmax(0,1fr);gap:34px;align-items:start}
.side{position:sticky;top:calc(var(--head) + 30px)}
.rail{list-style:none;margin:0;padding:0;position:relative}
.rail::before{content:"";position:absolute;inset-inline-start:22px;top:18px;bottom:18px;width:1px;background:var(--line-2)}
.rail li{position:relative}
.rail button{all:unset;cursor:pointer;display:flex;gap:13px;align-items:center;width:100%;padding:7px 10px;border-radius:12px;color:var(--muted);font-size:14.5px;box-sizing:border-box;transition:background .2s,color .2s}
.rail button:hover{color:var(--ink);background:#ECECE5}
.rail button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dotn{position:relative;z-index:1;width:25px;height:25px;border-radius:50%;background:var(--paper);border:1px solid var(--line-2);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none;transition:all .3s var(--ease)}
.rail .done .dotn{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.rail .cur button{color:var(--ink);font-weight:600;background:var(--card);box-shadow:0 1px 0 var(--line),0 8px 20px -12px rgba(22,24,27,.25)}
.rail .cur .dotn{background:var(--ink);border-color:var(--ink);color:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
.side-card{margin-top:20px;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.75}
.side-card b{color:var(--ink);font-weight:600}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;margin-top:8px;display:inline-block;transition:color .2s}
.linkbtn:hover{color:var(--ink)}
.linkbtn.armed{color:var(--warn)}

/* ───────── Card & step header ───────── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:40px 44px 32px;box-shadow:0 1px 0 rgba(22,24,27,.02),0 30px 60px -40px rgba(22,24,27,.18)}
#stage{transition:opacity .18s ease,transform .18s ease}
.card.leaving #stage{opacity:0;transform:translateY(8px)}
.shead{display:flex;align-items:flex-start;gap:20px;margin-bottom:6px}
.bignum{font-family:var(--num);font-weight:800;font-size:56px;line-height:.9;color:var(--ink);letter-spacing:-1px;position:relative;padding-top:4px;flex:none}
.bignum::after{content:"";position:absolute;inset-inline-start:2px;bottom:-10px;width:26px;height:4px;background:var(--lime);border-radius:2px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--olive);font-weight:600;letter-spacing:.1px}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--lime);transform:rotate(45deg)}
h1.title{font-size:30px;line-height:1.35;margin:2px 0 0;font-weight:700;letter-spacing:-.3px}
.lead{color:var(--muted);margin:18px 0 22px;max-width:64ch;font-size:15.5px}

/* Hero (first step) */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:18px;padding:36px 38px 30px;margin:-14px -18px 26px}
.hero .mk{position:absolute;inset-inline-end:-70px;top:-60px;width:290px;color:var(--lime);opacity:.1;pointer-events:none}
.hero .mk svg{width:100%;height:auto;display:block}
.hero .eyebrow{color:var(--lime)}
.hero h1.title{color:#fff;font-size:32px;max-width:20ch}
.hero .lead{color:#BFC2BA;margin:12px 0 24px}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}
.perk{border:1px solid #33363A;border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.03)}
.perk b{display:flex;align-items:center;gap:8px;font-size:14.5px;color:#fff}
.perk b::before{content:"";width:7px;height:7px;background:var(--lime);transform:rotate(45deg);flex:none}
.perk span{display:block;font-size:12.5px;color:#A9ACA4;margin-top:2px}

/* ───────── Fields ───────── */
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px}
.field{grid-column:1/-1;padding:20px 0;border-top:1px solid var(--line);min-width:0;scroll-margin-top:calc(var(--head) + 24px)}
.fgrid > .field:first-child,.fgrid > .field.half:first-child + .field.half{border-top:0}
.field.half{grid-column:auto}
.flabel{display:block;font-weight:600;margin-bottom:8px;line-height:1.65;font-size:15.5px}
.req{color:var(--warn);margin-inline-start:3px}
.hint{font-size:13.5px;color:var(--muted);margin:-4px 0 12px}
.ctx{background:var(--sand);border-radius:14px;padding:12px 15px;font-size:13.5px;margin:2px 0 14px;color:var(--sand-ink);line-height:1.8}
.ctx b{color:#7A4A12;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--sand-ink);background:#fff;border-radius:999px;padding:1px 9px;margin-inline-end:7px;vertical-align:1px}
.input{width:100%;border:1px solid var(--line-2);background:#FCFCFA;border-radius:13px;padding:12px 15px;outline:none;min-height:48px;transition:border-color .2s,box-shadow .2s,background .2s}
.input:hover{border-color:#C4C5B9}
.input:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(200,218,43,.38)}
.input::placeholder{color:#A6A89F}
textarea.input{min-height:104px;resize:vertical;line-height:1.75}
select.input{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:16px 52%,21px 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ltr{direction:ltr;text-align:right}
.affix{position:relative}
.affix .input{padding-inline-end:76px}
.affix .suf{position:absolute;inset-inline-end:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.err{color:#B3261E;font-size:13px;margin-top:6px;display:none}
.field.invalid .err{display:block}
.field.invalid .input{border-color:#E09A93;box-shadow:0 0 0 4px rgba(224,154,147,.18)}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.stack{flex-direction:column;align-items:stretch}
.chip{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:9px 15px;font-size:14.5px;display:inline-flex;align-items:center;gap:10px;line-height:1.55;transition:background .22s var(--ease),border-color .22s,color .22s,transform .15s var(--ease),box-shadow .22s}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip:active{transform:scale(.97)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips.stack .chip{border-radius:15px;padding:12px 16px}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid #BFC1B5;flex:none;display:grid;place-items:center;transition:all .22s var(--ease);background:#fff}
.chips.multi .tick{border-radius:5px}
.tick::after{content:"";width:7px;height:3.5px;border:2px solid var(--lime);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .25s var(--ease)}
.chip[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:600;box-shadow:0 6px 16px -10px rgba(140,155,0,.9)}
.chip[aria-pressed="true"] .tick{background:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"] .tick::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.sub{margin-top:12px;display:grid;gap:8px}
.drow{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:12px;align-items:center;font-size:14px}
.drow > span{color:var(--muted)}

/* ───────── Projects ───────── */
.ptools{position:sticky;top:calc(var(--head) + 3px);z-index:6;display:flex;align-items:center;gap:14px;margin:0 -12px 14px;padding:12px 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.ptools .sum{font-size:13.5px;color:var(--muted)}
.ptools .sum b{color:var(--ink);font-family:var(--num);font-size:16px}
.pbar{flex:1;height:6px;border-radius:6px;background:#EEEEE7;overflow:hidden;max-width:260px;margin-inline-start:auto}
.pbar i{display:block;height:100%;background:var(--lime);border-radius:6px;transition:width .6s var(--ease)}
.pcard{border:1px solid var(--line);border-radius:18px;margin-bottom:12px;background:#fff;overflow:hidden;transition:box-shadow .3s var(--ease),border-color .3s;scroll-margin-top:calc(var(--head) + 70px)}
.pcard:hover{border-color:var(--line-2)}
.pcard.open{border-color:var(--ink);box-shadow:0 18px 40px -26px rgba(22,24,27,.35)}
.pcard.off .phead{opacity:.5}
.phead{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;box-sizing:border-box}
.phead:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:18px}
.pidx{width:34px;height:34px;border-radius:11px;background:var(--paper);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:15px;flex:none;transition:background .3s}
.pcard.open .pidx{background:var(--lime)}
.ptxt{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:3px 11px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap;font-weight:600;flex:none}
.badge.ok{background:var(--lime-soft);color:var(--olive)}
.badge.off{background:#EEEDE8;color:#8A8B84}
.chev{width:9px;height:9px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .35s var(--ease);flex:none;margin:0 4px 4px 2px}
.pcard.open .chev{transform:rotate(135deg);margin-bottom:-4px;border-color:var(--ink)}
.pbody{padding:2px 20px 20px;border-top:1px solid var(--line);background:#FDFDFB}
.pcard.opening .pbody{animation:reveal .45s var(--ease) both}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pbody .field{padding:15px 0}
.field.special{border-top:0;padding:15px 18px;margin:12px 0 6px;background:var(--lime-soft);border-radius:16px;border-inline-start:3px solid var(--lime)}
.field.special .flabel::before{content:"سؤال خاص بهذا المشروع";display:block;font-size:11.5px;color:var(--olive);font-weight:700;margin-bottom:2px}
.pcard .field.empty:not(.special) .flabel::after{content:"ناقص";font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px;margin-inline-start:8px;vertical-align:1px}
.addp{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;border:1.5px dashed var(--line-2);border-radius:18px;padding:16px;color:var(--muted);font-weight:600;transition:all .25s var(--ease)}
.addp:hover{border-color:var(--ink);color:var(--ink);background:var(--lime-soft)}
.addp::before{content:"+";width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:17px;line-height:1}

/* Logos */
.ltable{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(150px,190px) 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);transition:background .2s}
.lrow:hover{background:#FCFCF9}
.lrow:first-child{border-top:0}
.lrow .ln{font-weight:600;font-size:14.5px;line-height:1.5}
.lrow .ln small{display:block;font-weight:600;color:var(--olive);font-size:11.5px;margin-top:2px}
.lrow .chips{gap:6px}
.lrow .chip{padding:6px 11px;font-size:13.5px;gap:7px}

/* Buttons & nav */
.btn{all:unset;cursor:pointer;box-sizing:border-box;padding:13px 24px;border-radius:14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .25s var(--ease),color .25s,transform .15s var(--ease),box-shadow .25s;text-align:center}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri .arr{width:22px;height:22px;border-radius:50%;background:var(--lime);display:grid;place-items:center;transition:transform .3s var(--ease)}
.btn.pri .arr::after{content:"";width:6px;height:6px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translate(1px,-1px)}
.btn.pri:hover .arr{transform:translateX(-3px)}
.btn.pri:hover{box-shadow:0 10px 24px -12px rgba(22,24,27,.6)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.lime:hover{background:var(--lime-2)}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:#F0F0EA}
.btn.line{border:1px solid var(--line-2);color:var(--ink);background:#fff}
.btn.line:hover{border-color:var(--ink)}
.btn.danger{color:#B3261E;font-size:13.5px;padding:8px 0}
.btn[disabled]{opacity:.5;pointer-events:none}
.nav{display:flex;align-items:center;gap:14px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.nav .count{font-size:13px;color:var(--muted)}
.nav .count b{font-family:var(--num);color:var(--ink);font-size:15px}
.nav .btn.pri{margin-inline-start:auto}

/* Review */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}
.stat{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#FCFCFA}
.stat b{display:block;font-family:var(--num);font-size:27px;line-height:1.25;direction:ltr;text-align:right;font-weight:700}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hi{background:var(--ink);border-color:var(--ink)}
.stat.hi b{color:var(--lime)}
.stat.hi span{color:#A9ACA4}
.notice{border-radius:16px;padding:14px 18px;font-size:14px;margin-bottom:18px;background:var(--lime-soft);color:#3E4800}
.notice.warn{background:var(--warn-soft);color:#6A3510}
.rv{border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.rv-h{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:#FAFAF6;border-bottom:1px solid var(--line)}
.rv-h h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:10px}
.rv-h h3 .num{font-size:14px;color:var(--muted)}
.rv-h .linkbtn{margin:0;color:var(--olive);text-decoration:none;font-weight:700;font-size:13.5px}
.rv dl{margin:0;padding:4px 20px 8px}
.rv .r{display:grid;grid-template-columns:minmax(150px,36%) 1fr;gap:14px;padding:9px 0;border-top:1px solid #F0F0EA;font-size:14px}
.rv .r:first-child{border-top:0}
.rv dt{color:var(--muted)}
.rv dd{margin:0;word-break:break-word;unicode-bidi:plaintext;text-align:right}
.miss{color:var(--warn);font-weight:600;font-size:13px}
.was{color:#9A9B93;font-size:12.5px;margin-inline-start:6px}
.rvp{padding:13px 0;border-top:1px solid #F0F0EA}
.rvp:first-child{border-top:0}
.rvp-h{display:flex;gap:10px;align-items:center;margin-bottom:7px}
.rvp-h b{font-size:14.5px}
.rvp-items{display:flex;flex-wrap:wrap;gap:6px}
.it{font-size:12.5px;background:#F3F3EE;border-radius:8px;padding:3px 9px}
.it i{font-style:normal;color:var(--muted)}
.it.m{background:var(--warn-soft);color:var(--warn)}
.confirm{display:flex;gap:12px;align-items:flex-start;margin:22px 0 6px;font-size:14.5px;cursor:pointer;padding:14px 16px;border-radius:16px;border:1px solid var(--line);transition:border-color .2s,background .2s}
.confirm:hover{border-color:var(--ink)}
.confirm input{width:19px;height:19px;margin-top:4px;accent-color:var(--ink);flex:none}
.hp{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);opacity:0}
.sendrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.errbox{display:none;margin-top:14px;padding:14px 18px;border-radius:16px;background:#FCECEA;color:#7A1D16;font-size:14px}
.errbox.on{display:block}

/* Done */
.done-wrap{text-align:center;padding:34px 10px 16px}
.done-mk{width:96px;height:96px;border-radius:28px;background:var(--ink);color:var(--lime);display:grid;place-items:center;margin:0 auto 22px;animation:pop .7s var(--ease) both}
.done-mk svg{width:46px;height:auto}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.05) rotate(2deg);opacity:1}100%{transform:none}}
.done-wrap .lead{margin:12px auto 24px}
.done-wrap .sendrow{justify-content:center}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:60;max-width:90vw;text-align:center;display:flex;gap:10px;align-items:center;box-shadow:0 14px 30px -14px rgba(22,24,27,.6)}
.toast::before{content:"";width:7px;height:7px;background:var(--lime);transform:rotate(45deg);flex:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px}
.foot svg{height:14px;width:auto;color:var(--ink)}

/* Entrance motion */
#stage.enter .shead,#stage.enter .hero,#stage.enter .lead,#stage.enter .field,#stage.enter .pcard,#stage.enter .ptools,#stage.enter .rv,#stage.enter .stats,#stage.enter .notice,#stage.enter .ltable,#stage.enter .addp{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.field.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%{background:transparent}25%{background:rgba(200,218,43,.12)}100%{background:transparent}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

@media (max-width:980px){
  :root{--head:58px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:16px 12px 120px;gap:0}
  .side{display:none}
  .top-in{padding:0 16px}
  .logo svg{height:27px}
  .top-title{display:none}
  .card{padding:22px 18px 18px;border-radius:20px}
  .hero{margin:-6px -6px 22px;padding:28px 22px 22px;border-radius:16px}
  .hero h1.title{font-size:26px}
  .hero .mk{width:170px;top:-50px;inset-inline-end:-75px;opacity:.08}
  .perks{grid-template-columns:1fr}
  .shead{gap:14px}
  .bignum{font-size:44px}
  h1.title{font-size:23px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .field.half{grid-column:1/-1}
  .fgrid > .field.half:first-child + .field.half{border-top:1px solid var(--line)}
  .drow,.lrow{grid-template-columns:1fr;gap:6px}
  .stats{grid-template-columns:1fr 1fr}
  .rv .r{grid-template-columns:1fr;gap:2px}
  .nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:30}
  .pbody{padding:2px 14px 14px}
  .phead{padding:13px 14px;gap:10px}
  .ptools{margin:0 -6px 12px;padding:10px 6px}
  .pbar{max-width:120px}
  .toast{bottom:92px}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-in">
    <div class="logo" id="logo"></div>
    <div class="top-title" id="topTitle"></div>
    <div class="save" id="save"><span class="dot"></span><span id="saveTxt">يُحفظ تلقائياً</span></div>
  </div>
  <div class="prog"><i id="pbar"></i></div>
</header>

<div class="wrap">
  <aside class="side" id="side"></aside>
  <main>
    <div class="card" id="card">
      <div id="stage"></div>
      <div class="nav" id="nav">
        <button type="button" class="btn ghost" id="prev">السابق</button>
        <span class="count" id="count"></span>
        <button type="button" class="btn pri" id="next"><span id="nextTxt">التالي</span><span class="arr"></span></button>
      </div>
    </div>
    <div class="foot" id="foot"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const clone = o => JSON.parse(JSON.stringify(o));
const byKey = k => PROJECTS.find(p => p.key === k);

function defaults(){
  const a = {};
  STEPS.forEach(s => (s.fields||[]).forEach(f => { if (f.pre !== undefined) a[f.id] = clone(f.pre); }));
  a.projects = PROJECTS.map(p => Object.assign({key:p.key, include: p.include !== undefined ? p.include : 'يُعرض', city:'الرياض'}, clone(p.pre)));
  a.logos = {};
  LOGOS.forEach(l => { if (l.pre) a.logos[l.id] = l.pre; });
  return a;
}
const PRE = defaults();
let A = defaults();
const UI = { cur:0, visited:new Set([0]), open:new Set(), resetArmed:false, busy:false };

function load(){
  try{
    const raw = localStorage.getItem(CONFIG.storageKey);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && d.A){
      A = Object.assign(defaults(), d.A);
      if(!Array.isArray(A.projects)) A.projects = defaults().projects;
      if(!A.logos) A.logos = {};
      if(d.ui){ UI.cur = Math.min(d.ui.cur||0, STEPS.length-1); UI.visited = new Set(d.ui.visited||[0]); }
      return true;
    }
  }catch(e){}
  return false;
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try{
      localStorage.setItem(CONFIG.storageKey, JSON.stringify({A, ui:{cur:UI.cur, visited:[...UI.visited]}}));
      const el = document.getElementById('save');
      el.classList.add('on'); document.getElementById('saveTxt').textContent = 'حُفظ تلقائياً';
      clearTimeout(save.t2); save.t2 = setTimeout(()=>el.classList.remove('on'), 1800);
    }catch(e){}
  }, 250);
}

function getP(path){ return path.split('|').reduce((o,k)=> o==null ? undefined : o[k], A); }
function setP(path, v){
  const ks = path.split('|'); let o = A;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null || typeof o[ks[i]]!=='object') o[ks[i]] = {}; o = o[ks[i]]; }

}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isEmpty = v => v==null || v==='' || (Array.isArray(v) && v.length===0);
const norm = v => Array.isArray(v) ? [...v].sort() : (v==null ? '' : v);
const same = (a,b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));
const normDigits = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const num = v => Number(v).toLocaleString('en-US');
const pad = n => String(n).padStart(2,'0');
const labelOf = (f,o) => typeof f.label==='function' ? f.label(o) : f.label;
const visible = (f,o) => !f.showIf || f.showIf(o);
const optsOf = (f,o) => f.optionsFrom ? f.optionsFrom(o) : f.options;
const wait = ms => new Promise(r => setTimeout(r, ms));
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function plural(n, one, two, few, many){ return n===1?one : n===2?two : (n>=3&&n<=10)? `${n} ${few}` : `${n} ${many}`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'), 2600); }

function fmt(f, v, o){
  if(isEmpty(v)) return '';
  switch(f.type){
    case 'money': return num(v) + ' ريال';
    case 'number': return num(v) + (f.suffix ? ' ' + f.suffix : '');
    case 'chips': return (f.other && v===f.other && o[f.id+'__o']) ? `${v}: ${o[f.id+'__o']}` : String(v);
    case 'multi': {
      const d = o[f.id+'__d'] || {};
      return v.map(x => x===f.other ? (o[f.id+'__o'] ? `${x}: ${o[f.id+'__o']}` : x) : (d[x] ? `${x} (${d[x]})` : x)).join('، ');
    }
    default: return String(v);
  }
}

let lenis = null;
function initScroll(){
  if(window.Lenis && !REDUCED){
    lenis = new Lenis({ autoRaf:true, lerp:0.085, smoothWheel:true, wheelMultiplier:0.95, anchors:false,
      prevent: node => node.tagName==='TEXTAREA' || node.tagName==='SELECT' });
  }
  const top = document.getElementById('top');
  const onScroll = () => top.classList.toggle('scrolled', window.scrollY > 6);
  window.addEventListener('scroll', onScroll, {passive:true}); onScroll();
}
const headH = () => document.getElementById('top').getBoundingClientRect().height;
function scrollToY(y, immediate){
  y = Math.max(0, y);
  if(lenis){ lenis.resize(); lenis.scrollTo(y, {immediate:!!immediate, duration:1.05, easing:t => 1 - Math.pow(1 - t, 4), force:true}); }
  else window.scrollTo({top:y, behavior:(immediate||REDUCED)?'auto':'smooth'});
}
function scrollToEl(el, extra){ if(!el) return; scrollToY(el.getBoundingClientRect().top + window.scrollY - headH() - (extra==null?20:extra)); }
function keepScroll(y){ if(lenis) lenis.resize(); if(Math.abs(window.scrollY - y) > 1){ if(lenis) lenis.scrollTo(y, {immediate:true, force:true}); else window.scrollTo(0, y); } }

function chipsHTML(f, v, p, multi, opts){
  return `<div class="chips ${multi?'multi':''} ${f.stack?'stack':''}" role="group">` + opts.map(o => {
    const on = multi ? (v||[]).includes(o) : v===o;
    return `<button type="button" class="chip" data-chip data-path="${esc(p)}" data-val="${esc(o)}" data-mode="${multi?'multi':'single'}"${f.max?` data-max="${f.max}"`:''}${f.other===o?' data-other="1"':''} aria-pressed="${on}"><span class="tick"></span><span dir="auto">${esc(o)}</span></button>`;
  }).join('') + `</div>`;
}

function fieldHTML(f, o, base, inProject){
  if(!visible(f,o)) return '';
  const p = base + f.id, v = o[f.id], label = labelOf(f,o);
  const empty = isEmpty(v);
  let inner = '';
  const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
  switch(f.type){
    case 'text': case 'email': case 'url': case 'tel': {
      const t = {email:'email', url:'url', tel:'tel'}[f.type] || 'text';
      const ltr = f.ltr || f.type!=='text';
      inner = `<input class="input ${ltr?'ltr':''}" type="${t}" data-path="${esc(p)}" data-type="${f.type}" value="${esc(v||'')}"${ph} aria-label="${esc(label)}"${f.type==='tel'?' inputmode="tel" autocomplete="tel"':''}>`;
      break;
    }
    case 'number': case 'money': {
      const shown = empty ? '' : (f.type==='money' || String(v).length>3 ? num(v) : v);
      inner = `<div class="affix"><input class="input" type="text" inputmode="numeric" data-path="${esc(p)}" data-type="${f.type}" value="${esc(shown)}"${ph} aria-label="${esc(label)}">${f.suffix?`<span class="suf">${f.suffix}</span>`:''}</div>`;
      break;
    }
    case 'textarea':
      inner = `<textarea class="input" data-lenis-prevent data-path="${esc(p)}" data-type="text" aria-label="${esc(label)}">${esc(v||'')}</textarea>`; break;
    case 'select':
      inner = `<select class="input" data-path="${esc(p)}" data-type="select" aria-label="${esc(label)}"><option value="">اختاروا…</option>${f.options.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select>`; break;
    case 'chips': {
      const opts = optsOf(f,o);
      inner = opts.length ? chipsHTML(f, v, p, false, opts) : `<p class="hint">اختاروا الخدمات أعلاه أولاً.</p>`;
      if(f.other && v===f.other) inner += `<div class="sub"><input class="input" data-path="${esc(p)}__o" data-type="text" value="${esc(o[f.id+'__o']||'')}" placeholder="اكتبوا هنا" aria-label="${esc(label)}"></div>`;
      break;
    }
    case 'multi': {
      inner = chipsHTML(f, v, p, true, f.options);
      const sel = v || [], d = o[f.id+'__d'] || {};
      const rows = sel.filter(x => x!==f.other && (f.detail || (f.detailFor && f.detailFor[x]))).map(x =>
        `<div class="drow"><span>${esc(x)}</span><input class="input ${f.ltrDetail?'ltr':''}" data-path="${esc(p)}__d|${esc(x)}" data-type="text" value="${esc(d[x]||'')}" placeholder="${esc((f.detailFor&&f.detailFor[x])||f.detail)}" aria-label="${esc(x)}"></div>`).join('');
      const other = (f.other && sel.includes(f.other)) ? `<input class="input" data-path="${esc(p)}__o" data-type="text" value="${esc(o[f.id+'__o']||'')}" placeholder="${esc(f.other)}: اكتبوا هنا" aria-label="${esc(f.other)}">` : '';
      if(rows || other) inner += `<div class="sub">${rows}${other}</div>`;
      break;
    }
  }
  const cls = ['field', f.half?'half':'', f.special?'special':'', (inProject && f.req && empty)?'empty':''].join(' ');
  return `<div class="${cls}" data-fid="${esc(f.id)}" data-req="${f.req?1:0}">
    <span class="flabel">${esc(label)}${f.block?'<span class="req">*</span>':''}</span>
    ${f.hint?`<p class="hint">${f.hint}</p>`:''}
    ${f.ctx?`<div class="ctx">${f.ctx}</div>`:''}
    ${inner}
    ${f.block?`<div class="err">هذا الحقل مطلوب للمتابعة.</div>`:''}
  </div>`;
}

const qField = q => ({id:'q_'+q.id, type:'chips', stack:true, special:true, req:true, label:q.label, hint:q.hint, options:q.options, other:q.other, s:q.s});
function projMissing(pr){
  if(pr.include===OFF) return 0;
  const def = byKey(pr.key) || {};
  let n = 0;
  PF.forEach(f => { if(f.req && visible(f,pr) && isEmpty(pr[f.id])) n++; });
  (def.q||[]).forEach(q => { if(isEmpty(pr['q_'+q.id])) n++; });
  return n;
}
function badgeHTML(pr){
  if(pr.include===OFF) return `<span class="badge off">مستبعد</span>`;
  const m = projMissing(pr);
  return m ? `<span class="badge">ينقصه ${plural(m,'بيان واحد','بيانان','بيانات','بياناً')}</span>` : `<span class="badge ok">مكتمل</span>`;
}
function projectHTML(pr, i){
  const def = byKey(pr.key) || {};
  const open = UI.open.has(pr.key), off = pr.include===OFF;
  const sub = [pr.client, pr.district].filter(Boolean).join(' · ');
  let body = '';
  if(open){
    const base = `projects|${i}|`;
    let fields = `<div class="fgrid">${fieldHTML(PF[0], pr, base, true)}</div>`;
    if(!off) fields += (def.note?`<div class="ctx"><span class="tag">ملاحظة</span>${def.note}</div>`:'')
        + (def.q||[]).map(q => fieldHTML(qField(q), pr, base, true)).join('')
        + `<div class="fgrid">${PF.slice(1).map(f => fieldHTML(f, pr, base, true)).join('')}</div>`;
    body = `<div class="pbody">${fields}${def.key?'':`<button type="button" class="btn danger" data-del="${esc(pr.key)}">حذف هذا المشروع</button>`}</div>`;
  }
  return `<div class="pcard ${open?'open':''} ${off?'off':''} ${UI.opening===pr.key?'opening':''}" data-card="${esc(pr.key)}">
    <button type="button" class="phead" data-toggle="${esc(pr.key)}" aria-expanded="${open}">
      <span class="pidx">${pad(i+1)}</span>
      <span class="ptxt"><span class="pn">${esc(pr.name||'مشروع جديد')}</span><span class="pc">${esc(sub||'—')}</span></span>
      ${badgeHTML(pr)}<span class="chev"></span>
    </button>${body}</div>`;
}
function projectsSummary(){
  const shown = A.projects.filter(p=>p.include!==OFF);
  const done = shown.filter(p=>!projMissing(p)).length;
  const n = shown.length, w = (n>=3 && n<=10) ? 'مشاريع معروضة' : 'مشروعاً معروضاً';
  return `<span class="sum">اكتمل <b>${done}</b> من <b>${n}</b> ${w}</span><span class="pbar"><i style="width:${n?Math.round(done/n*100):0}%"></i></span>`;
}

/* =====================================================================
   التجميع (المراجعة والرسالة يستخدمان المصدر نفسه)
   ===================================================================== */
function sanitize(){
  STEPS.forEach(s => (s.fields||[]).forEach(f => {
    if(f.optionsFrom && A[f.id] && !f.optionsFrom(A).includes(A[f.id])) A[f.id] = '';
  }));
}
function compile(){
  sanitize();
  const secs = []; let missing = 0, changed = 0;
  STEPS.forEach((s, si) => {
    if(s.custom==='review') return;
    const sec = {si, title:s.title, rows:[]};
    if(s.custom==='projects'){
      sec.projects = A.projects.map(pr => {
        const def = byKey(pr.key) || {}; const pre = (PRE.projects.find(x=>x.key===pr.key)) || {};
        if(pr.include===OFF) return {name:pr.name, off:true};
        const items = [];
        if(isEmpty(pr.include)){ items.push({label:'العرض', val:'', miss:true}); missing++; }
        (def.q||[]).forEach(q => { const f=qField(q); const v=pr[f.id]; const e=isEmpty(v); if(e) missing++; items.push({label:q.s, val:e?'':fmt(f,v,pr), miss:e, q:true}); });
        PF.forEach(f => {
          if(f.id==='include' || f.id==='name' || !visible(f,pr)) return;
          const v = pr[f.id], e = isEmpty(v);
          if(e && f.req) missing++;
          let was = null;
          if(pre[f.id]!==undefined && !same(pre[f.id], v)){ was = fmt(f, pre[f.id], pre) || '—'; changed++; }
          if(!e || f.req) items.push({label:f.s, val:e?'':fmt(f,v,pr), miss:e && f.req, was});
        });
        let nameWas = null;
        if(pre.name!==undefined && !same(pre.name, pr.name)){ nameWas = pre.name; changed++; }
        return {name:pr.name||'مشروع بلا اسم', nameWas, items, miss:projMissing(pr), isNew:!def.key};
      });
    }
    if(s.custom==='clients'){
      LOGOS.forEach(l => { const v=A.logos[l.id]; const e=isEmpty(v); if(e) missing++;
        let was=null; if(l.pre && v!==l.pre){ was=l.pre; changed++; }
        sec.rows.push({label:l.name, val:v||'', miss:e, was}); });
    }
    (s.fields||[]).forEach(f => {
      if(!visible(f,A)) return;
      const v = A[f.id], e = isEmpty(v);
      if(e && f.req) missing++;
      let was = null;
      if(f.pre!==undefined && !same(f.pre, v)){ was = fmt(f, f.pre, {}) || '—'; changed++; }
      sec.rows.push({label:f.s||labelOf(f,A), val:e?'':fmt(f,v,A), miss:e && !!f.req, empty:e, was});
    });
    secs.push(sec);
  });
  const shown = A.projects.filter(p => p.include!==OFF);
  const total = shown.reduce((t,p) => t + (Number(p.value)||0), 0);
  return {secs, missing, changed, shown:shown.length, total, at:new Date()};
}

function reviewHTML(){
  const r = compile();
  const stats = `<div class="stats">
    <div class="stat hi"><b>${r.shown}</b><span>المشاريع المعروضة</span></div>
    <div class="stat"><b>${num(r.total)}</b><span>مجموع قيمها (ريال)</span></div>
    <div class="stat"><b>${r.missing}</b><span>أسئلة بلا إجابة</span></div>
    <div class="stat"><b>${r.changed}</b><span>بيانات عدّلتموها</span></div></div>`;
  const notice = r.missing
    ? `<div class="notice warn">عدد الأسئلة التي لم تُجب: <b>${r.missing}</b>. يمكنكم الإرسال الآن وإكمالها لاحقاً معنا، لكن اكتمالها يختصر وقت التنفيذ.</div>`
    : `<div class="notice">أجبتم عن جميع الأسئلة الأساسية. شكراً لكم.</div>`;
  const val = row => row.val ? `${esc(row.val)}${row.was?`<span class="was">(كان: ${esc(row.was)})</span>`:''}` : (row.miss?`<span class="miss">لم تُعبّأ</span>`:`<span class="was" style="margin:0">—</span>${row.was?`<span class="was">(كان: ${esc(row.was)})</span>`:''}`);
  const secs = r.secs.map(s => {
    let inner = '';
    if(s.projects){
      inner += s.projects.map(p => p.off ? `<div class="rvp"><div class="rvp-h"><b style="color:var(--muted)">${esc(p.name)}</b><span class="badge off">مستبعد</span></div></div>`
        : `<div class="rvp"><div class="rvp-h"><b>${esc(p.name)}</b>${p.nameWas?`<span class="was">(كان: ${esc(p.nameWas)})</span>`:''}${p.miss?`<span class="badge">ينقصه ${plural(p.miss,'بيان واحد','بيانان','بيانات','بياناً')}</span>`:`<span class="badge ok">مكتمل</span>`}</div>
          <div class="rvp-items">${p.items.map(it=>`<span class="it ${it.miss?'m':''}"><i>${esc(it.label)}:</i> ${it.miss?'ناقص':esc(it.val)}${it.was?` <i>(كان: ${esc(it.was)})</i>`:''}</span>`).join('')}</div></div>`).join('');
    }
    inner += s.rows.map(row => `<div class="r"><dt>${esc(row.label)}</dt><dd>${val(row)}</dd></div>`).join('');
    return `<section class="rv"><div class="rv-h"><h3><span class="num">${pad(s.si+1)}</span>${esc(s.title)}</h3><button type="button" class="linkbtn" data-go="${s.si}">تعديل</button></div><dl>${inner}</dl></section>`;
  }).join('');
  return stats + notice + secs + `
    <label class="confirm"><input type="checkbox" id="agree"> <span>أؤكد أن البيانات صحيحة بحسب علمي، وأوافق على استخدامها في إعداد البروفايل.</span></label>

    <button type="button" class="btn line" id="dl">تنزيل نسخة من الإجابات</button></div>
    <div class="errbox" id="errbox"></div>`;
}

/* =====================================================================

function emailHTML(r, compact){
  const br = CONFIG.colors.brand, ink = CONFIG.colors.ink, ol = CONFIG.colors.olive, mu = '#6D7068', wn = '#B0531C';

  const W = t => compact ? '' : ` <font color=#9A9B93 size=2>(كان: ${esc(t)})</font>`;

    + `<div style="font-size:23px;font-weight:bold;margin-top:4px">${esc(CONFIG.client.name)}</div><div style="font-size:12px;color:#A9ACA4;margin-top:4px">${esc(when)}</div></td></tr>`
    + `<tr><td style="padding:20px 26px 6px"><table width=100% cellpadding=0 cellspacing=0 style="border:1px solid #E4E4DC;background:#FCFCFA"><tr><td style="padding:14px 16px">`
    + `<div style="font-size:12px;color:${mu}">مقدّم الإجابات</div><div style="font-size:16px;font-weight:bold">${esc(A.contact_name||'—')}${A.contact_role?` <font color=${mu} size=2>— ${esc(fmt(STEPS[0].fields[2], A.contact_role, A))}</font>`:''}</div>`
    + `<div style="margin-top:4px"><a href="tel:${esc(A.contact_phone||'')}" style="color:${ol};text-decoration:none">${esc(A.contact_phone||'')}</a>${A.contact_email?` &nbsp;·&nbsp; <a href="mailto:${esc(A.contact_email)}" style="color:${ol};text-decoration:none">${esc(A.contact_email)}</a>`:''}</div>`
    + `</td></tr></table></td></tr>`
    + `<tr><td style="padding:10px 26px 4px"><table width=100% cellpadding=0 cellspacing=0 style="border-collapse:collapse;text-align:center"><tr>`
    + cell(r.shown,'مشاريع معروضة',true) + cell(num(r.total),'مجموع القيم (ريال)') + cell(`<font color=${r.missing?wn:ol}>${r.missing}</font>`,'أسئلة بلا إجابة') + cell(r.changed,'بيانات عدّلها العميل')
    + `</tr></table></td></tr>`;
  r.secs.forEach((s, n) => {
    h += `<tr><td style="padding:18px 26px 0"><div style="font-size:15px;font-weight:bold;color:${ink};border-bottom:3px solid ${br};padding-bottom:5px;margin-bottom:4px">${pad(n+1)} · ${esc(s.title)}</div>`;
    if(s.projects){
      s.projects.forEach((p, i) => {
        if(p.off){ h += `<div style="padding:6px 0;color:${mu}">${i+1}. ${esc(p.name)} — مستبعد</div>`; return; }
        const head = `<b>${i+1}. ${esc(p.name)}</b>${p.isNew?` <font color=${ol} size=2>[مشروع جديد]</font>`:''}${p.nameWas?W(p.nameWas):''}`;
        const filled = p.items.filter(it => !it.miss).map(it => `${L(it.label+':')} ${V(it.val)}${it.was?W(it.was):''}`);
        const miss = p.items.filter(it => it.miss).map(it => esc(it.label));
        let body = filled.join(compact?' · ':'<br>');
        if(miss.length) body += `${body?'<br>':''}<font color=${wn}>ناقص: ${miss.join('، ')}</font>`;

    if(s.rows.length){
      h += `<table width=100% cellpadding=7 cellspacing=0 style="font-size:13.5px">`;

/* نسخة نصية مختصرة جداً تُستخدم فقط إن تجاوزت الرسالة حد الحجم في الخطة المجانية */
function minimalHTML(r){
  const f = plainFields(r);
  return `<div dir=rtl style="font-family:Tahoma,Arial,sans-serif;font-size:13px;line-height:1.8"><b>${esc(CONFIG.client.name)} — ${esc(A.contact_name||'')} — ${esc(A.contact_phone||'')}</b><br>مشاريع معروضة: ${r.shown} · مجموع القيم: ${num(r.total)} ريال · أسئلة بلا إجابة: ${r.missing}<br>`
    + Object.entries(f).map(([k,v]) => `<b>${esc(k)}</b>: ${esc(v).replace(/\n/g,' · ')}`).join('<br>') + `</div>`;
}
const emailDoc = r => `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إجابات ${esc(CONFIG.client.name)}</title></head><body style="margin:0">${emailHTML(r,false)}</body></html>`;

function plainFields(r){
  const out = {};
  r.secs.forEach((s, n) => {
    if(s.projects) s.projects.forEach((p, i) => {
      out[`${n+1}. ${s.title} — ${i+1}. ${p.name}`] = p.off ? 'مستبعد' : p.items.map(it => `${it.label}: ${it.miss?'لم تُعبّأ':it.val}${it.was?` (كان: ${it.was})`:''}`).join('\n');
    });
    s.rows.forEach(row => { out[`${n+1}. ${s.title} — ${row.label}`] = row.val ? row.val + (row.was?` (كان: ${row.was})`:'') : (row.miss?'لم تُعبّأ':'—'); });
  });
  return out;
}

/* =====================================================================
   الإرسال
   ===================================================================== */
const bytes = s => new Blob([s]).size;
function configured(){
  return CONFIG.provider==='web3forms' ? !/^YOUR_/.test(CONFIG.web3forms.accessKey) : !/^YOUR_/.test(CONFIG.emailjs.publicKey) && !/^YOUR_/.test(CONFIG.emailjs.serviceId) && !/^YOUR_/.test(CONFIG.emailjs.templateId);
}
function emailjsBody(r, html){
  return {service_id:CONFIG.emailjs.serviceId, template_id:CONFIG.emailjs.templateId, user_id:CONFIG.emailjs.publicKey,
    template_params:{
      subject:`نموذج البروفايل: ${CONFIG.client.name} — ${A.contact_name||''}`,
      company:CONFIG.client.name, contact_name:A.contact_name||'', contact_phone:A.contact_phone||'',
      reply_to:A.contact_email||CONFIG.agency.email, report_html:html }};
}
async function sendEmailJS(r){
  let body = emailjsBody(r, emailHTML(r,false));
  if(bytes(JSON.stringify(body)) > 47000) body = emailjsBody(r, emailHTML(r,true));
  if(bytes(JSON.stringify(body)) > 47000) body = emailjsBody(r, minimalHTML(r));
  if(bytes(JSON.stringify(body)) > 49500) throw new Error('payload-too-large');
  const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!res.ok) throw new Error(await res.text());
}
async function sendWeb3(r){
  const payload = Object.assign({
    access_key:CONFIG.web3forms.accessKey,
    subject:`نموذج البروفايل: ${CONFIG.client.name} — ${A.contact_name||''}`,
    from_name:`${CONFIG.agency.name} — نموذج البروفايل`,
    replyto:A.contact_email||undefined,
    'مقدّم الإجابات':`${A.contact_name||''} — ${A.contact_phone||''}`,
    'الملخص':`مشاريع معروضة: ${r.shown} · مجموع القيم: ${num(r.total)} ريال · أسئلة بلا إجابة: ${r.missing} · بيانات معدّلة: ${r.changed}`
  }, plainFields(r));
  const res = await fetch('https://api.web3forms.com/submit', {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'}, body:JSON.stringify(payload)});
  const j = await res.json().catch(()=>({}));
  if(!res.ok || !j.success) throw new Error(j.message || 'web3forms-error');
}
function downloadCopy(){
  const blob = new Blob([emailDoc(compile())], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `إجابات-بروفايل-${CONFIG.client.name}.html`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
async function submit(){
  const btn = document.getElementById('send'), eb = document.getElementById('errbox');
  eb.classList.remove('on');
  if(!A.contact_name || !A.contact_phone){ toast('نحتاج إلى اسمكم ورقم الجوال أولاً'); go(0); return; }
  const ag = document.getElementById('agree');
  if(!ag.checked){ toast('يُرجى تأكيد صحة البيانات أولاً'); scrollToEl(ag.closest('.confirm'), 120); return; }
  if(document.getElementById('hp').value){ showDone(); return; }
  const r = compile();
  if(!configured()){
    eb.innerHTML = `<b>وضع المعاينة:</b> لم تُربط خدمة البريد بعد، فلم تُرسل الإجابات. فتحنا لكم معاينة الرسالة كما ستصل. (أضيفوا المفاتيح في قسم CONFIG داخل الملف.)`;
    eb.classList.add('on'); scrollToEl(eb, 140);
    const w = window.open('', '_blank'); if(w){ w.document.write(emailDoc(r)); w.document.close(); }
    return;
  }
  btn.disabled = true; const t = btn.firstElementChild.textContent; btn.firstElementChild.textContent = 'جارٍ الإرسال…';
  try{
    if(CONFIG.provider==='web3forms') await sendWeb3(r); else await sendEmailJS(r);
    A.__sentAt = new Date().toISOString(); save(); showDone();
  }catch(err){
    console.error(err);
    eb.innerHTML = `تعذّر الإرسال الآن. حاولوا مرة أخرى بعد قليل، أو نزّلوا نسخة من الإجابات وأرسلوها إلينا عبر <a href="https://wa.me/${CONFIG.agency.whatsapp}" target="_blank" rel="noopener">واتساب</a> أو <a href="mailto:${CONFIG.agency.email}">البريد</a>. إجاباتكم محفوظة على هذا الجهاز ولن تضيع.`;
    eb.classList.add('on'); scrollToEl(eb, 140);
  }finally{ btn.disabled = false; btn.firstElementChild.textContent = t; }
}

function render(enter){

/* بصمة البنية: إن لم تتغير بعد النقر فلا داعي لإعادة الرسم */
function signature(){
  const s = STEPS[UI.cur];
  const fs = (fields, o) => fields.filter(f=>visible(f,o)).map(f=>{
    const v = o[f.id]; let x = f.id;
    if(typeof f.label==='function') x += '~' + labelOf(f,o);
    if(f.other && (v===f.other || (Array.isArray(v) && v.includes(f.other)))) x += '+o';
    if(f.type==='multi' && (f.detail || f.detailFor)) x += '+d' + (v||[]).filter(t=>f.detail || (f.detailFor && f.detailFor[t])).join('/');
    if(f.optionsFrom) x += '+f' + f.optionsFrom(o).join('/');
    return x;
  }).join(',');
  if(s.custom==='projects') return A.projects.map(p => UI.open.has(p.key) ? p.key+'['+p.include+']'+fs(PF,p) : p.key).join(';');
  return fs(s.fields||[], A);
}
function validate(){
  const s = STEPS[UI.cur]; let ok = true;
  (s.fields||[]).forEach(f => {
    if(!f.block || !visible(f,A)) return;
    const el = stage.querySelector(`[data-fid="${f.id}"]`);
    const bad = isEmpty(A[f.id]) || (f.type==='tel' && String(A[f.id]).replace(/\D/g,'').length < 9);
    if(el) el.classList.toggle('invalid', bad);
    if(bad) ok = false;
  });
  if(A.contact_email && UI.cur===0 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.contact_email)){ toast('صيغة البريد الإلكتروني غير صحيحة'); return false; }
  if(!ok){ toast('أكملوا الحقول المطلوبة للمتابعة'); const f = stage.querySelector('.invalid'); if(f){ scrollToEl(f, 40); const inp=f.querySelector('.input'); if(inp) setTimeout(()=>inp.focus({preventScroll:true}), 350); } }
  return ok;
}
async function go(i){
  if(UI.busy) return;
  i = Math.max(0, Math.min(STEPS.length-1, i));
  if(i === UI.cur && stage.innerHTML && !UI.done) return;
  if(i > UI.cur && UI.cur===0 && !validate()) return;
  UI.busy = true;
  const card = document.getElementById('card');
  card.classList.add('leaving');
  await wait(REDUCED ? 0 : 170);
  UI.cur = i; UI.visited.add(i); UI.resetArmed = false;
  render(true);
  scrollToY(0, true);
  card.classList.remove('leaving');
  save(); UI.busy = false;
}
/* بعد اختيار إجابة واحدة: انزلاق هادئ إلى السؤال التالي إن كان بعيداً عن النظر */
function glideToNext(fieldEl, chip){
  if(!fieldEl) return;
  const row = chip && chip.closest('.lrow');
  const all = row ? [...stage.querySelectorAll('.lrow')] : [...stage.querySelectorAll('.field')].filter(f => !f.querySelector('.ltable'));
  const nxt = all[all.indexOf(row || fieldEl) + 1];
  if(!nxt || !nxt.closest('#stage')) return;
  const r = nxt.getBoundingClientRect(), vh = window.innerHeight;
  const bottomSafe = window.matchMedia('(max-width:980px)').matches ? 90 : 0;
  if(r.top > vh * 0.68 - bottomSafe || r.top < headH()){
    scrollToY(window.scrollY + r.top - vh * 0.3);
    if(nxt.classList.contains('field')){ nxt.classList.remove('flash'); void nxt.offsetWidth; nxt.classList.add('flash'); }
  }
}

stage.addEventListener('click', e => {
  const chip = e.target.closest('[data-chip]');
  if(chip){
    const path = chip.dataset.path, val = chip.dataset.val, multi = chip.dataset.mode==='multi';
    const before = signature();
    let selected;
    if(multi){
      const arr = [...(getP(path)||[])]; const i = arr.indexOf(val);
      if(i>-1) arr.splice(i,1);
      else { const max = +chip.dataset.max||0; if(max && arr.length>=max){ toast(`يمكن اختيار ${max} كحد أقصى`); return; } arr.push(val); }
      setP(path, arr); selected = arr.includes(val);
      chip.setAttribute('aria-pressed', String(selected));
    }else{
      selected = getP(path)!==val; setP(path, selected ? val : '');
      chip.parentElement.querySelectorAll('[data-chip]').forEach(b => b.setAttribute('aria-pressed', String(b===chip && selected)));
    }
    const fieldEl = chip.closest('.field');
    if(fieldEl) fieldEl.classList.remove('invalid');
    const m = path.match(/^projects\|(\d+)\|/);
    if(signature() !== before){
      const y = window.scrollY; render(false); keepScroll(y);
      const again = stage.querySelector(`[data-chip][data-path="${CSS.escape(path)}"][data-val="${CSS.escape(val)}"]`);
      if(again) again.focus({preventScroll:true});
      if(selected && chip.dataset.other){ const o = again && again.closest('.field').querySelector('.sub .input'); if(o) setTimeout(()=>o.focus({preventScroll:true}), 60); }
      else if(selected && !multi && again) glideToNext(again.closest('.field'), again);
    }else{
      if(m) refreshCard(+m[1], fieldEl, path);
      if(selected && !multi && !chip.dataset.other) glideToNext(fieldEl, chip);
    }
    return;
  }
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const k = tg.dataset.toggle, wasOpen = UI.open.has(k);
    const y = window.scrollY;
    UI.open.clear();
    if(!wasOpen){ UI.open.add(k); UI.opening = k; }
    render(false); keepScroll(y);
    const card = stage.querySelector(`[data-card="${CSS.escape(k)}"]`);
    if(card && !wasOpen) requestAnimationFrame(()=>scrollToEl(card, 64));
    return;
  }
  if(e.target.closest('#addp')){
    const key = 'new_' + Date.now();
    A.projects.push({key, include:'يُعرض', city:'الرياض'}); UI.open.clear(); UI.open.add(key); UI.opening = key; save();
    const y = window.scrollY; render(false); keepScroll(y);
    const card = stage.querySelector(`[data-card="${key}"]`);
    if(card){ requestAnimationFrame(()=>scrollToEl(card, 64)); const f=card.querySelector('[data-fid="name"] .input'); if(f) setTimeout(()=>f.focus({preventScroll:true}), 700); }
    return;
  }
  const del = e.target.closest('[data-del]');
  if(del){ A.projects = A.projects.filter(p => p.key!==del.dataset.del); UI.open.clear(); save(); const y=window.scrollY; render(false); keepScroll(y); toast('حُذف المشروع'); }
});
function refreshCard(i, fw, path){
  const pr = A.projects[i], card = stage.querySelector(`[data-card="${CSS.escape(pr.key)}"]`);
  if(!card) return;
  card.querySelector('.badge').outerHTML = badgeHTML(pr);
  card.querySelector('.pn').textContent = pr.name || 'مشروع جديد';
  card.querySelector('.pc').textContent = [pr.client, pr.district].filter(Boolean).join(' · ') || '—';
  if(fw && fw.dataset.req==='1' && !fw.classList.contains('special')) fw.classList.toggle('empty', isEmpty(getP(path)));
  const sum = stage.querySelector('.ptools'); if(sum) sum.innerHTML = projectsSummary();
}
stage.addEventListener('input', e => {
  const el = e.target.closest('[data-path]'); if(!el || el.dataset.chip!==undefined) return;
  const path = el.dataset.path, t = el.dataset.type;
  let v = el.value;
  if(t==='money' || t==='number'){
    const d = normDigits(v).replace(/[^\d]/g,'');
    setP(path, d);
    if(t==='money' || d.length>3){ const nv = d ? num(d) : ''; if(nv!==el.value){ el.value = nv; el.setSelectionRange(nv.length, nv.length); } }
    else if(d!==el.value) el.value = d;
  }else if(t==='tel'){ v = normDigits(v); if(v!==el.value) el.value = v; setP(path, v.trim()); }
  else if(t==='select'){ return; }
  else setP(path, v);
  const fw = el.closest('.field'); if(fw) fw.classList.remove('invalid');
  const m = path.match(/^projects\|(\d+)\|/);
  if(m) refreshCard(+m[1], fw, path);
});
stage.addEventListener('change', e => {
  const el = e.target.closest('select[data-path]'); if(!el) return;
  const before = signature();
  setP(el.dataset.path, el.value);
  const m = el.dataset.path.match(/^projects\|(\d+)\|/);
  if(signature() !== before){ const y = window.scrollY; render(false); keepScroll(y); }
  else if(m) refreshCard(+m[1], el.closest('.field'), el.dataset.path);
});
stage.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.matches('input.input') && STEPS[UI.cur].custom!=='review'){ e.preventDefault(); go(UI.cur+1); }
});

/* بدء التشغيل */
(function init(){
  const root = document.documentElement.style;
  root.setProperty('--lime', CONFIG.colors.brand); root.setProperty('--ink', CONFIG.colors.ink); root.setProperty('--olive', CONFIG.colors.olive);
  document.getElementById('logo').innerHTML = CONFIG.agency.logo ? `<img src="${esc(CONFIG.agency.logo)}" alt="${esc(CONFIG.agency.name)}">` : LOGO_SVG;
  document.getElementById('topTitle').innerHTML = `نموذج محتوى البروفايل · <b>${esc(CONFIG.client.name)}</b>`;
  document.getElementById('foot').innerHTML = `${MARK_SVG}<span>أعدّته ${esc(CONFIG.agency.name)} لإعداد بروفايل ${esc(CONFIG.client.name)}. تبقى بياناتكم على جهازكم حتى تضغطوا «إرسال».</span>`;
  if(location.hash==='#preview-email'){ load(); const html = emailDoc(compile()); document.addEventListener('DOMContentLoaded', () => { document.open(); document.write(html); document.close(); }); return; }
  const resumed = load();
  initScroll();
  render(true);
  if(resumed && A.contact_name) setTimeout(()=>toast(`مرحباً ${A.contact_name}، تابعوا من حيث توقفتم`), 500);
})();
</script>
